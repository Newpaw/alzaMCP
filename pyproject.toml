[project]
name = "alza-mcp"
version = "0.1.0"
description = "Alza Trade API v2 MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.11,<5",
    "httpx[socks]>=0.28,<1",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
alza-mcp = "alza_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
