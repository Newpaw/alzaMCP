name: Test and publish container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/newpaw/alzamcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Load and smoke-test the actual image before publishing it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: alza-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container transport, health and authentication
        shell: bash
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp:rw,size=32m --cap-drop ALL --security-opt no-new-privileges -e MCP_API_KEY=ci-smoke-key -p 127.0.0.1:8000:8000 alza-mcp:smoke
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/readyz)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = 401
          curl -fsS http://127.0.0.1:8000/mcp -H 'Authorization: Bearer ci-smoke-key' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' > /tmp/mcp-init.json
          python -c 'import json; assert json.load(open("/tmp/mcp-init.json"))["result"]["serverInfo"]["name"] == "Alza Trade"'
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
