services:
  alza-mcp:
    image: ghcr.io/newpaw/alzamcp:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:${MCP_PUBLISHED_PORT:-8019}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 1.0
